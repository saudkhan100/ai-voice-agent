[project]
name = "dealer-ai"
version = "0.1.0"
description = "AI voice agent that calls, qualifies and books dealership leads"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "phonenumbers>=8.13",
    "twilio>=9.0",
    "pipecat-ai[google,openai,websocket]>=1.11,<2",
    "google-genai>=1.0",
    "loguru>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
